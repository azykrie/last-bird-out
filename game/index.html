<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ctext y='16'%3E🦃%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#183c3b"><title>Last Bird Out — A Turkey Escape</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./extra.css"></head>
<body><main class="frame"><aside class="rail"><div class="seal">LB<span>O</span></div><p class="eyebrow">A THANKSGIVING HEIST</p><h1>LAST<br>BIRD<br><i>OUT</i></h1><p class="railcopy">One bird.<br>Three bad rooms.<br>Absolutely no brine.</p><div class="rail-bottom"><span class="leaf">✳</span><span>EST. BEFORE DINNER</span></div></aside><section class="stage"><canvas id="scene" width="1042" height="800" aria-label="Illustrated turkey escape game"></canvas><div class="topline"><div class="brand">THE GREAT GOBBLE GETAWAY <span>✦</span></div><div class="hud" id="hud"><span>✧ <b id="score">0000</b></span><span>ROAD <b id="distance">0</b>m</span><span>HEARTS <b id="lives">♥ ♥ ♥</b></span></div></div><button id="start" class="start">MAKE A BREAK FOR IT →</button><div class="status" id="status" aria-live="polite"></div><div class="controls"><button id="left" aria-label="Move left">←</button><button id="jump" aria-label="Jump">JUMP <small>SPACE</small></button><button id="crouch" aria-label="Crouch">HIDE <small>↓</small></button><button id="right" aria-label="Move right">→</button><button id="dash" aria-label="Dash">DASH <small>SHIFT</small></button><button id="pause" aria-label="Pause">Ⅱ</button><button id="sound" aria-label="Toggle sound">♫ ON</button></div><div class="hint" id="hint">← → CHANGE LANES &nbsp; • &nbsp; SPACE JUMP &nbsp; • &nbsp; ↓ DUCK &nbsp; • &nbsp; SHIFT DASH</div></section></main><script type="module" src="./src/main.js"></script></body></html>
